<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">大端序和小端序的字节排列</title>
  <desc id="desc">同一个 32 位数 0x12345678，在大端序下高位字节 12 放在低地址，在小端序下低位字节 78 放在低地址。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <style>
      .title { font: 800 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 800 23px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .addr { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .byte { font: 800 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #111827; }
      .hint { font: 600 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
    </style>
  </defs>

  <rect x="24" y="24" width="992" height="472" rx="34" fill="#fff" stroke="#111827" stroke-width="2.5" stroke-dasharray="8 9" />
  <text x="64" y="76" class="title">同一个 0x12345678，4 个字节怎么放进内存？</text>

  <line x1="210" y1="116" x2="850" y2="116" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <text x="530" y="106" class="hint" text-anchor="middle">地址从低到高增长</text>

  <g transform="translate(70,150)">
    <text x="0" y="62" class="label">大端序</text>
    <text x="0" y="92" class="hint">高位字节先放</text>
    <g transform="translate(170,0)">
      <text x="70" y="0" class="addr" text-anchor="middle">0x100</text>
      <text x="220" y="0" class="addr" text-anchor="middle">0x101</text>
      <text x="370" y="0" class="addr" text-anchor="middle">0x102</text>
      <text x="520" y="0" class="addr" text-anchor="middle">0x103</text>

      <rect x="0" y="20" width="140" height="86" rx="8" fill="#dbeafe" stroke="#111827" stroke-width="2" />
      <rect x="150" y="20" width="140" height="86" rx="8" fill="#eff6ff" stroke="#111827" stroke-width="2" />
      <rect x="300" y="20" width="140" height="86" rx="8" fill="#eff6ff" stroke="#111827" stroke-width="2" />
      <rect x="450" y="20" width="140" height="86" rx="8" fill="#eff6ff" stroke="#111827" stroke-width="2" />

      <text x="70" y="74" class="byte" text-anchor="middle">12</text>
      <text x="220" y="74" class="byte" text-anchor="middle">34</text>
      <text x="370" y="74" class="byte" text-anchor="middle">56</text>
      <text x="520" y="74" class="byte" text-anchor="middle">78</text>
      <text x="295" y="135" class="hint" text-anchor="middle">人类读数顺序：12 34 56 78</text>
    </g>
  </g>

  <g transform="translate(70,330)">
    <text x="0" y="62" class="label">小端序</text>
    <text x="0" y="92" class="hint">低位字节先放</text>
    <g transform="translate(170,0)">
      <text x="70" y="0" class="addr" text-anchor="middle">0x100</text>
      <text x="220" y="0" class="addr" text-anchor="middle">0x101</text>
      <text x="370" y="0" class="addr" text-anchor="middle">0x102</text>
      <text x="520" y="0" class="addr" text-anchor="middle">0x103</text>

      <rect x="0" y="20" width="140" height="86" rx="8" fill="#fee2e2" stroke="#111827" stroke-width="2" />
      <rect x="150" y="20" width="140" height="86" rx="8" fill="#fff1f2" stroke="#111827" stroke-width="2" />
      <rect x="300" y="20" width="140" height="86" rx="8" fill="#fff1f2" stroke="#111827" stroke-width="2" />
      <rect x="450" y="20" width="140" height="86" rx="8" fill="#fff1f2" stroke="#111827" stroke-width="2" />

      <text x="70" y="74" class="byte" text-anchor="middle">78</text>
      <text x="220" y="74" class="byte" text-anchor="middle">56</text>
      <text x="370" y="74" class="byte" text-anchor="middle">34</text>
      <text x="520" y="74" class="byte" text-anchor="middle">12</text>
      <text x="295" y="135" class="hint" text-anchor="middle">内存里看到的顺序：78 56 34 12</text>
    </g>
  </g>
</svg>
